<div 
  class="confirm-dialog-overlay" 
  *ngIf="visible"
  (click)="onOverlayClick($event)"
  [attr.aria-hidden]="!visible"
  [attr.aria-modal]="visible">
  <div class="confirm-dialog-container" role="dialog" aria-labelledby="dialog-header" aria-describedby="dialog-message">
    <div class="confirm-dialog-header">
      <h2 id="dialog-header" class="confirm-dialog-title">{{ header }}</h2>
      <button 
        class="confirm-dialog-close" 
        (click)="onCloseClick()"
        aria-label="Close dialog"
        type="button">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    
    <div class="confirm-dialog-content">
      <p id="dialog-message" class="confirm-dialog-message">{{ message }}</p>
    </div>
    
    <div class="confirm-dialog-footer">
      <button 
        type="button"
        class="confirm-dialog-button confirm-dialog-button--cancel"
        (click)="onReject()">
        {{ rejectLabel }}
      </button>
      <button 
        type="button"
        class="confirm-dialog-button confirm-dialog-button--accept"
        (click)="onAccept()">
        {{ acceptLabel }}
      </button>
    </div>
  </div>
</div>
