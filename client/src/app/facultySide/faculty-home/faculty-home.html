<div class="layout">
    <app-sidenavbar></app-sidenavbar>
  
    <div class="content">
        

      <div class="rectangle">
        <h2 class="dept-title">Faculty-in-Charge Classes</h2>
  
        <!-- Loading State -->
        <div *ngIf="isLoadingBlocks" style="text-align: center; padding: 2rem; color: #666;">
          <p>Loading your classes...</p>
        </div>

        <!-- Empty State -->
        <div *ngIf="!isLoadingBlocks && ficPrograms.length === 0" 
             style="text-align: center; padding: 2rem; color: #800000; font-size: 1.1rem;">
          <p>No Capstone Class</p>
        </div>

        <!-- Data Table -->
        <table *ngIf="!isLoadingBlocks && ficPrograms.length > 0" 
               class="dept-table" 
               role="table" 
               aria-label="Faculty-in-Charge Classes">
            <thead>
                <tr>
                  <th colspan="2" class="no-pad"></th>
                </tr>
              </thead>
              
          <tbody>
                      <tr *ngFor="let program of ficPrograms">
                        <td>{{ program.program_name }}</td>
                        <td class="action-col">
                          <button class="btn"
                                  [routerLink]="['/for-fic']"
                                  [queryParams]="{ program: program.program_id }">
                            View Classes
                          </button>
                        </td>
                      </tr>
          </tbody>
        </table>

        
      </div>

        

      <div class="rectangle">
        <h2 class="dept-title">Research Panelist Classes</h2>
  
        <!-- Loading State -->
        <div *ngIf="isLoadingBlocks" style="text-align: center; padding: 2rem; color: #666;">
          <p>Loading your panelist classes...</p>
        </div>

        <!-- Empty State -->
        <div *ngIf="!isLoadingBlocks && panelistPrograms.length === 0" 
             style="text-align: center; padding: 2rem; color: #800000; font-size: 1.1rem;">
          <p>Not Panelling in a Capstone Class</p>
        </div>

        <!-- Data Table -->
        <table *ngIf="!isLoadingBlocks && panelistPrograms.length > 0" 
               class="dept-table" 
               role="table" 
               aria-label="Research Panelist Classes">
            <thead>
                <tr>
                  <th colspan="2" class="no-pad"></th>
                </tr>
              </thead>
              
          <tbody>
                      <tr *ngFor="let program of panelistPrograms">
                        <td>{{ program.program_name }}</td>
                        <td class="action-col">
                          <button class="btn"
                                  [routerLink]="['/for-panel']"
                                  [queryParams]="{ program: program.program_id }">
                            View Classes
                          </button>
                        </td>
                      </tr>
          </tbody>
        </table>

        
      </div>
